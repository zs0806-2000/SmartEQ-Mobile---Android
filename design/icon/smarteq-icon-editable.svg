<?xml version="1.0" encoding="UTF-8"?>
<!-- SmartyQ app icon, concept T3 "Bands cut into the brain". Editable master.
     Artboard 108 x 108 = Android adaptive-icon canvas. Keep the brain inside the
     66-unit circle in the "Guides" layer so launchers never crop it.
     Layers: Guides (hidden), Background, Brain (two hemispheres), Bands (the
     negative-space EQ slots, applied as a mask; in Illustrator they import as an
     opacity mask, or select Brain + Bands and use Pathfinder > Minus Front). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="brain-gradient" gradientUnits="userSpaceOnUse" x1="30" y1="24" x2="80" y2="86">
      <stop offset="0" stop-color="#FFB599"/>
      <stop offset="0.55" stop-color="#F7B7C6"/>
      <stop offset="1" stop-color="#CDB9F2"/>
    </linearGradient>
    <radialGradient id="background-glow" gradientUnits="userSpaceOnUse" cx="24" cy="20" r="80">
      <stop offset="0" stop-color="#FFB599" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFB599" stop-opacity="0"/>
    </radialGradient>
    <mask id="bands-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <rect x="0" y="0" width="108" height="108" fill="#FFFFFF"/>
      <g id="Bands">
      <rect id="band-1" x="45.39" y="38.16" width="3.37" height="34.65" rx="1.68" fill="#000000"/>
      <rect id="band-2" x="39.94" y="46.08" width="3.37" height="26.73" rx="1.68" fill="#000000"/>
      <rect id="band-3" x="34.50" y="52.02" width="3.37" height="20.79" rx="1.68" fill="#000000"/>
      <rect id="band-4" x="59.25" y="41.13" width="3.37" height="31.68" rx="1.68" fill="#000000"/>
      <rect id="band-5" x="64.69" y="49.05" width="3.37" height="23.76" rx="1.68" fill="#000000"/>
      <rect id="band-6" x="70.14" y="54.99" width="3.37" height="17.82" rx="1.68" fill="#000000"/>
      </g>
    </mask>
  </defs>
  <g id="Guides" display="none">
    <circle cx="54" cy="54" r="33" fill="none" stroke="#00B3FF" stroke-width="0.3"/>
  </g>
  <g id="Background">
    <rect width="108" height="108" fill="#141113"/>
    <rect width="108" height="108" fill="url(#background-glow)"/>
  </g>
